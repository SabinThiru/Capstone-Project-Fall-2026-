spring.application.name=backend

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/campuspath}
spring.datasource.username=${DB_USERNAME:campuspath}
spring.datasource.password=${DB_PASSWORD:campuspath}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.sql.init.mode=never


#replace placeholder values
cognito.user-pool-id=${COGNITO_USER_POOL_ID:us-east-2_PLACEHOLDER}
cognito.client-id=${COGNITO_CLIENT_ID:placeholder-client-id}
cognito.client-secret=${COGNITO_CLIENT_SECRET}

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5500,http://127.0.0.1:5500,http://localhost:5173,http://localhost:3000}