<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Chat | CampusPath</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Outfit:wght@600;700&display=swap" rel="stylesheet" />
    <script src="js/settings.js"></script>
    <link rel="stylesheet" href="css/dashboard.css" />
    <link rel="stylesheet" href="css/settings.css" />
    <link rel="stylesheet" href="css/chat.css" />
  </head>

  <body>

    <!-- Navigation -->
    <header class="topbar">
      <div class="logo">
        <span class="logo-mark">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none"
            stroke="currentColor" stroke-width="1.8"
            stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M22 10 12 5 2 10l10 5 10-5Z" />
            <path d="M6 12v5c3 2.5 9 2.5 12 0v-5" />
            <path d="M22 10v6" />
          </svg>
        </span>
        <span class="logo-text">CampusPath</span>
      </div>
      <nav class="nav-links" aria-label="Main navigation">
        <a href="dashboard.html">Dashboard</a>
        <a href="schedule.html">Schedule</a>
        <a class="active" aria-current="page" href="chat.html">Chat</a>
        <a href="settings.html">Settings</a>
      </nav>
      <div class="user-menu">
        <span class="user-avatar" id="userAvatar"></span>
        <span id="navUserName">Student</span>
        <a href="login.html">Log out</a>
      </div>
    </header>

    <main class="chat-layout" id="chatLayout">

<!-- Left side of page with conversation list & filters -->
      <aside class="chat-sidebar" aria-label="Conversations">
        <div class="sidebar-head">
          <h1>Messages</h1>
          <div class="head-actions">
            <button type="button" class="icon-btn" id="newDmBtn" aria-label="New message" title="New message">
              <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M12 20h9" />
                <path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z" />
              </svg>
            </button>
            <button type="button" class="new-group-btn" id="newGroupBtn">
              <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M12 5v14M5 12h14" />
              </svg>
              New group
            </button>
          </div>
        </div>
        <div class="chat-search">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="11" cy="11" r="7" />
            <path d="m20 20-3.5-3.5" />
          </svg>
          <input type="search" id="chatSearch" placeholder="Search chats" aria-label="Search chats" autocomplete="off" />
        </div>

        <div class="filter-row">
          <label for="courseFilter">Course</label>
          <select id="courseFilter">
            <option value="all">All my courses</option>
          </select>
        </div>

        <div class="type-tabs" role="tablist" aria-label="Conversation type">
          <button type="button" role="tab" class="tab active" data-type="all" aria-selected="true">All</button>
          <button type="button" role="tab" class="tab" data-type="group" aria-selected="false">Groups</button>
          <button type="button" role="tab" class="tab" data-type="dm" aria-selected="false">Direct</button>
        </div>

        <ul class="conversation-list" id="conversationList"></ul>
        <p class="empty-message list-empty" id="listEmpty" hidden></p>
      </aside>

      <!-- Right side of page with actual conversation open -->
      <section class="chat-main" aria-label="Conversation">
        <div class="chat-placeholder" id="chatEmpty">
          <svg viewBox="0 0 24 24" width="40" height="40" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12Z" />
          </svg>
          <h2>Select a chat</h2>
          <p>Pick a conversation, or start a new group with students from your courses.</p>
        </div>

        <div class="chat-panel" id="chatPanel" hidden>
          <header class="chat-header">
            <button type="button" class="back-btn" id="backBtn" aria-label="Back to conversations">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M19 12H5M11 6l-6 6 6 6" />
              </svg>
            </button>
            <span class="convo-avatar" id="chatAvatar"></span>
            <div class="chat-title">
              <h2 id="chatName"></h2>
              <p id="chatMeta"></p>
            </div>
            <span class="course-tag" id="chatCourse" hidden></span>
          </header>
          <div class="message-list" id="messageList" aria-live="polite"></div>
          <form class="composer" id="messageForm">
            <label for="messageInput" class="sr-only">Message</label>
            <textarea id="messageInput" rows="1" maxlength="1000" placeholder="Write a message…" autocomplete="off"></textarea>
            <button type="submit" class="send-btn" id="sendBtn" aria-label="Send message" disabled>
              <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M22 2 11 13M22 2l-7 20-4-9-9-4 20-7Z" />
              </svg>
